[package]
name = "nanai-shiftjis-notepad"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["nanai-shiftjis-notepad-dll"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR MIT AND Apache-2.0"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
#basic process
#cross
anyhow = "1.0.104"
encoding_rs = { version = "0.8.35" }
compio = { version = "0.19.2", features = ["fs", "runtime", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
#UI
#windows-reactor
windows-reactor = { git = "https://github.com/microsoft/windows-rs", branch = "master", optional = true }

#basic process
windows = { version = "0.62.2", features = [
    "ApplicationModel",
], optional = true }

#not windows
[target.'cfg(not(target_os = "windows"))'.dependencies]
#ui
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "wayland",
    "x11",
], optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
#UI
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", branch = "master", optional = true }
