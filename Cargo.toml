[package]
name = "nanai-shiftjis-reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["nanai-shiftjis-reader-dll"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR MIT AND Apache-2.0"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0.102"
encoding_rs = { version = "0.8" }
compio = { version = "0.18.0", features = ["fs", "runtime", "process"] }
gpui = "0.2"
windows = { version = "0.62", features = ["ApplicationModel"] }
